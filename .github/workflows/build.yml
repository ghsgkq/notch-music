name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Validate scripts
        run: zsh -n Scripts/*.sh

      - name: Build app bundle
        run: ./Scripts/build-app.sh

      - name: Verify app signature
        run: codesign --verify --deep --strict --verbose=2 "dist/Notch Music.app"
