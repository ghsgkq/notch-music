name: Bug report
description: Report a reproducible problem in Notch Music
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Do not include private playback data or credentials.
  - type: input
    id: version
    attributes:
      label: Notch Music version
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.0
    validations:
      required: true
  - type: dropdown
    id: display
    attributes:
      label: Display configuration
      options:
        - Built-in display only
        - Built-in and external displays
        - External display only (clamshell)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove personal media titles and other sensitive information first.
